plugins {
  id "com.android.application"
}

// Keystore und Zugangsdaten kommen ausschliesslich aus der Umgebung (CI-Secrets).
def keystorePath = (System.getenv("ANDROID_KEYSTORE_PATH") ?: "").trim()
def vCode = (System.getenv("APP_VERSION_CODE") ?: "").trim()
def vName = (System.getenv("APP_VERSION_NAME") ?: "").trim()

android {
  namespace "com.fechalbatakpale.hizbulazam"
  compileSdk 36

  defaultConfig {
    applicationId "com.fechalbatakpale.hizbulazam"
    minSdk 21
    targetSdk 36
    versionCode vCode ? vCode.toInteger() : 1
    versionName vName ? vName : "1.0.0"
  }

  signingConfigs {
    release {
      if (keystorePath) {
        storeFile file(keystorePath)
        storePassword (System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "").trim()
        keyAlias (System.getenv("ANDROID_KEY_ALIAS") ?: "").trim()
        keyPassword (System.getenv("ANDROID_KEY_PASSWORD") ?: "").trim()
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      shrinkResources false
      if (keystorePath) {
        signingConfig signingConfigs.release
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lint {
    abortOnError false
  }
}

dependencies {
  implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
  implementation "androidx.appcompat:appcompat:1.7.0"
}
