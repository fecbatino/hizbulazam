plugins {
  id "com.android.application"
}

// Keystore und Zugangsdaten kommen ausschliesslich aus der Umgebung (CI-Secrets).
def keystorePath = (System.getenv("ANDROID_KEYSTORE_PATH") ?: "").trim()
def vCode = (System.getenv("APP_VERSION_CODE") ?: "").trim()
def vName = (System.getenv("APP_VERSION_NAME") ?: "").trim()
def ksPass = (System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "").trim()
def ksAlias = (System.getenv("ANDROID_KEY_ALIAS") ?: "upload").trim()
def keyPass = (System.getenv("ANDROID_KEY_PASSWORD") ?: "").trim()

android {
  namespace "com.fechalbatakpale.hizbulazam"
  compileSdk 36

  defaultConfig {
    applicationId "com.fechalbatakpale.hizbulazam"
    minSdk 21
    targetSdk 36
    versionCode vCode ? vCode.toInteger() : 1
    versionName vName ? vName : "1.0.0"
  }

  signingConfigs {
    release {
      if (keystorePath) {
        storeFile file(keystorePath)
        storePassword ksPass
        keyAlias ksAlias
        keyPassword keyPass
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      shrinkResources false
      if (keystorePath) {
        signingConfig signingConfigs.release
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lint {
    abortOnError false
  }
}

// androidbrowserhelper bringt kotlin-stdlib-jdk7/jdk8 in 1.6.21 mit, appcompat
// kotlin-stdlib 1.8.22 - dieselben Klassen in zwei Modulen. Die jdk7/jdk8-Artefakte
// sind seit 1.8 nur noch Weiterleitungen und werden hier entfernt.
configurations.configureEach {
  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}

dependencies {
  implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
  implementation "androidx.appcompat:appcompat:1.7.0"
}
