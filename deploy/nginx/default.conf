server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Gehashte Build-Dateien: ein Jahr, unveränderlich
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Schriften ändern sich nie
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Daten: kurz cachen, damit Korrekturen ankommen
    location /data/ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Einstiegspunkte nie cachen - sonst hängen Nutzer auf alten Bundles
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # SPA-Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
