server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    include /etc/nginx/conf.d/security-headers.inc;

    # Hash-based navigation needs no server-side SPA fallback.
    # Error bodies keep the original 404, including for missing assets.
    error_page 404 /404.$hza_extension;

    location = / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept" always;
        add_header Link '</index.md>; rel="alternate"; type="text/markdown", </llms.txt>; rel="describedby"' always;
        if ($hza_representation = none) { return 406; }
        types { text/html html; text/markdown md; }
        try_files /index.$hza_extension =404;
    }

    location = /about {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept" always;
        if ($hza_representation = none) { return 406; }
        types { text/html html; text/markdown md; }
        try_files /about.$hza_extension =404;
    }

    location = /contact {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept" always;
        if ($hza_representation = none) { return 406; }
        types { text/html html; text/markdown md; }
        try_files /contact.$hza_extension =404;
    }

    # One copy of the existing, multilingual privacy policy; old links still work.
    location = /privacy { rewrite ^ /datenschutz.html last; }

    # Fixed HTML for the PWA precache; the public homepage still negotiates.
    location = /offline.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex" always;
    }

    location = /404.html {
        internal;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept" always;
        add_header X-Robots-Tag "noindex" always;
    }
    location = /404.md {
        internal;
        types { }
        default_type text/markdown;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location ~ \.md$ {
        types { }
        default_type text/markdown;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /llms.txt {
        types { }
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Gehashte Build-Dateien: ein Jahr, unveränderlich
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Altbestand ohne Versionspfad: nur noch für ältere geöffnete App-Versionen
    location /fonts/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /data/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Einstiegspunkte nie cachen - sonst hängen Nutzer auf alten Bundles
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        add_header Vary "Accept" always;
        if ($hza_representation = none) { return 406; }
        types { text/html html; text/markdown md; }
        try_files /index.$hza_extension =404;
    }
    location = /sw.js {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
    }

    # Releasekennung für den Smoke-Test, nie cachen
    location = /deployed-sha.txt {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store";
    }

    # Digital Asset Links fuer die Trusted Web Activity (Google Play).
    # Bewusst ohne SPA-Fallback: fehlt die Datei, muss 404 kommen, nicht HTML.
    location /.well-known/ {
        include /etc/nginx/conf.d/security-headers.inc;
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fehlende .html-Seiten muessen 404 liefern, nicht die App-Oberflaeche.
    location ~ \.html$ {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # All app routes are fragments on /. Missing resources must stay missing.
    location / {
        try_files $uri =404;
    }
}
