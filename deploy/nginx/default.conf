server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    include /etc/nginx/conf.d/security-headers.inc;

    # Gehashte Build-Dateien: ein Jahr, unveränderlich
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Altbestand ohne Versionspfad: nur noch für ältere geöffnete App-Versionen
    location /fonts/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /data/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Einstiegspunkte nie cachen - sonst hängen Nutzer auf alten Bundles
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
    }

    # Releasekennung für den Smoke-Test, nie cachen
    location = /deployed-sha.txt {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store";
    }

    # Digital Asset Links fuer die Trusted Web Activity (Google Play).
    # Bewusst ohne SPA-Fallback: fehlt die Datei, muss 404 kommen, nicht HTML.
    location /.well-known/ {
        include /etc/nginx/conf.d/security-headers.inc;
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fehlende .html-Seiten muessen 404 liefern, nicht die App-Oberflaeche.
    location ~ \.html$ {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # SPA-Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
