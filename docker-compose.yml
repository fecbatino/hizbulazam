services:
  hizbulazam:
    # Version mit Digest gepinnt; Updates bewusst per PR.
    image: nginx:1.30.6-alpine@sha256:c59d1f8b1e0e42da75be973424cd72e23f7f8adfb54e982f4d1cd0216a5a5576
    container_name: hizbulazam
    restart: unless-stopped
    # Nur-Lese-Dateisystem; nginx schreibt nur Cache, PID und Temp-Dateien.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Master startet als root und wechselt für die Worker auf den User nginx.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    # Kein Host-Port: Auslieferung über nginx-proxy-manager im web-network.
    # Webroot ist /var/www/hza (deploy/publish.sh). Lokal: HZA_ROOT=./dist.
    # Konfiguration als Verzeichnis einbinden: Git ersetzt Dateien durch neue
    # Inodes, ein Einzeldatei-Mount sähe danach weiter die alte Fassung.
    volumes:
      - ${HZA_ROOT:-/var/www/hza}:/usr/share/nginx/html:ro
      - ./deploy/nginx:/etc/nginx/conf.d:ro
    networks:
      - web-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

networks:
  web-network:
    external: true
    name: web-network
