name: Android AAB

# Wiederverwendbar: andere Apps rufen diesen Workflow per `uses:` auf und
# setzen project_dir auf ihr eigenes TWA-Verzeichnis.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (leer = 1)"
        required: false
      version_name:
        description: "versionName (leer = 1.0.0)"
        required: false
      project_dir:
        description: "Gradle-Projektverzeichnis"
        default: "android"
        required: false
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_call:
    inputs:
      version_code:
        type: string
        required: false
      version_name:
        type: string
        required: false
      project_dir:
        type: string
        required: false
        default: "android"
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks"
          test "$(stat -c %a "$RUNNER_TEMP/upload.jks")" = "600"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: AAB bauen
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ inputs.version_code }}
          APP_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          gradle -p "${{ inputs.project_dir || 'android' }}" --no-daemon bundleRelease

      - name: Artefakt prüfen und benennen
        run: |
          set -euo pipefail
          src="$(ls "${{ inputs.project_dir || 'android' }}"/app/build/outputs/bundle/release/*.aab)"
          mkdir -p out
          cp "$src" out/hizbulazam.aab
          {
            echo "datei: hizbulazam.aab"
            echo "groesse: $(stat -c %s out/hizbulazam.aab) bytes"
            echo "sha256: $(sha256sum out/hizbulazam.aab | cut -d' ' -f1)"
            unzip -l out/hizbulazam.aab | tail -2
          } | tee out/aab-info.txt
          unzip -l out/hizbulazam.aab | grep -q "base/manifest/AndroidManifest.xml"

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: out/
          retention-days: 30
