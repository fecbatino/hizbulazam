name: Deploy to Hetzner

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hza-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installieren
        run: npm ci

      - name: Typen
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Veröffentlichung und Bereinigung prüfen
        run: bash deploy/test-publish.sh

      - name: Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Browserprüfungen
        run: npm run test:e2e

      - name: Build-Artefakte sichern
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Ausliefern
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Build-Artefakte holen
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Host-Schlüssel kommt aus dem Secret statt aus ssh-keyscan: ein Scan zur
      # Laufzeit würde jedem Server vertrauen, der unter HOST antwortet.
      - name: SSH vorbereiten
        env:
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$KNOWN_HOSTS" ] || { echo "Secret SSH_KNOWN_HOSTS fehlt"; exit 1; }
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Stack abgleichen
        run: |
          set -euo pipefail
          ssh -p ${{ secrets.PORT }} ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "bash -s -- ${GITHUB_SHA}" < deploy/sync-stack.sh

      - name: Ausliefern
        run: |
          set -euo pipefail
          ssh -p ${{ secrets.PORT }} ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "mkdir -p /opt/stacks/hizbulazam/releases/${GITHUB_SHA}"
          rsync -avz \
            -e "ssh -p ${{ secrets.PORT }}" \
            dist/ \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/opt/stacks/hizbulazam/releases/${GITHUB_SHA}/
          ssh -p ${{ secrets.PORT }} ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "bash -s -- ${GITHUB_SHA}" < deploy/publish.sh

      - name: Smoke-Test
        run: |
          set -euo pipefail
          content="/assets/content/$(ls dist/assets/content)"
          for path in / /manifest.webmanifest "$content/collections.json"; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "https://hza.fechal-batakpale.com${path}?v=${GITHUB_SHA::7}")
            echo "${path} -> ${code}"
            [ "$code" = "200" ] || exit 1
          done
          deployed=$(curl -fsS "https://hza.fechal-batakpale.com/deployed-sha.txt?v=${GITHUB_SHA}")
          [ "$deployed" = "$GITHUB_SHA" ] || exit 1
          curl -fsSI "https://hza.fechal-batakpale.com/?v=${GITHUB_SHA::7}" |
            grep -qi '^content-security-policy:' ||
            { echo "Security-Header fehlen"; exit 1; }
          echo "Smoke-Test bestanden"
