name: Deploy to Hetzner

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hza-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ed25519-Fingerprint des Servers; prüfen mit
  # ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
  PIN: SHA256:XE0PbpKgL0tZ1Hh24ZuUd9DYJk4WZTH9e3fC4cKA9cw

jobs:
  verify:
    name: Prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installieren
        run: npm ci

      - name: Typen
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Veröffentlichung und Bereinigung prüfen
        run: bash deploy/test-publish.sh

      - name: Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Browserprüfungen
        # Test the real production routing, negotiation and headers as well as UI.
        run: npm run test:production

      - name: Build-Artefakte sichern
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          # Ohne dies verwirft upload-artifact alle Dot-Dateien - darunter
          # dist/.well-known/assetlinks.json (Trusted Web Activity).
          include-hidden-files: true
          retention-days: 7

  # Nur in PRs, nur lesend: scannt den Server immer (auch mit gesetztem
  # Secret) und prüft Secret und Server gegen den Pin, ohne Login. Auf main
  # macht das der Schritt „SSH vorbereiten“. Fork-PRs bekommen keine Secrets.
  hostkey:
    name: Host-Schlüssel prüfen
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret und Server gegen den Pin prüfen
        env:
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          SCAN_SERVER: "1"
        run: bash deploy/pin-host-key.sh

  deploy:
    name: Ausliefern
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # Als env statt ${{ }} im Skript: Werte bleiben gequotet und an einer Stelle.
    env:
      HOST: ${{ secrets.HOST }}
      PORT: ${{ secrets.PORT }}
      USERNAME: ${{ secrets.USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Build-Artefakte holen
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Nur der gepinnte ed25519-Schlüssel wird vertraut, und ssh darf keinen
      # anderen Schlüsseltyp aushandeln (deploy/pin-host-key.sh). Ein Check
      # "irgendeine Zeile passt" ließe einen zweiten, fremden Schlüssel zu.
      - name: SSH vorbereiten
        env:
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          bash deploy/pin-host-key.sh

      - name: Stack abgleichen
        run: |
          set -euo pipefail
          ssh -p "$PORT" "$USERNAME@$HOST" \
            "bash -s -- ${GITHUB_SHA}" < deploy/sync-stack.sh

      - name: Ausliefern
        run: |
          set -euo pipefail
          ssh -p "$PORT" "$USERNAME@$HOST" \
            "mkdir -p /opt/stacks/hizbulazam/releases/${GITHUB_SHA}"
          rsync -avz \
            -e "ssh -p $PORT" \
            dist/ \
            "$USERNAME@$HOST:/opt/stacks/hizbulazam/releases/${GITHUB_SHA}/"
          ssh -p "$PORT" "$USERNAME@$HOST" \
            "bash -s -- ${GITHUB_SHA}" < deploy/publish.sh

      - name: Smoke-Test
        run: |
          set -euo pipefail
          content="/assets/content/$(ls dist/assets/content)"
          for path in / /manifest.webmanifest "$content/collections.json"; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "https://hza.fechal-batakpale.com${path}?v=${GITHUB_SHA::7}")
            echo "${path} -> ${code}"
            [ "$code" = "200" ] || exit 1
          done
          deployed=$(curl -fsS "https://hza.fechal-batakpale.com/deployed-sha.txt?v=${GITHUB_SHA}")
          [ "$deployed" = "$GITHUB_SHA" ] || exit 1
          curl -fsSI "https://hza.fechal-batakpale.com/?v=${GITHUB_SHA::7}" |
            grep -qi '^content-security-policy:' ||
            { echo "Security-Header fehlen"; exit 1; }
          echo "Smoke-Test bestanden"
